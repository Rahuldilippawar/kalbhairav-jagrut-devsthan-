name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Core – analyze & test
        working-directory: packages/kjd_core
        run: flutter pub get && flutter analyze && flutter test
      - name: Devotee app – analyze & test
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Admin – analyze, test & build web
        working-directory: admin
        run: flutter pub get && flutter analyze && flutter test && flutter build web --release

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Build & unit test
        working-directory: functions
        run: npm ci && npm run build && npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - name: Firestore rules tests (emulator)
        working-directory: rules-test
        run: npm ci && npm test
