# Builds the devotee app APK on GitHub's servers – no computer needed.
# Run it from the GitHub mobile site: Actions → "Build Android APK" → Run workflow.
# The APK is attached to a pre-release, so it can be downloaded and
# installed straight on a phone.
#
# Firebase settings come from repository Variables (Settings → Secrets and
# variables → Actions → Variables). Without them the APK runs in demo mode.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: What is new (shown in the app's update dialog)
        required: false
        default: ""
      required:
        description: Older apps must update (they cannot be used until updated)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Headroom for Gradle/R8 + Dart AOT on the small private-repo runner:
      # drop toolchains this build never uses, then add swap.
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo fallocate -l 4G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          df -h / && free -h

      - name: Build APK
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          flutter pub get
          # Phones only (arm, arm64); x86_64 is just for emulators.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/kalbhairav-${{ github.run_number }}.apk"

      - name: Publish as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED: ${{ vars.FIREBASE_API_KEY != '' && vars.FIREBASE_ANDROID_APP_ID != '' }}
        run: |
          mode="Firebase: ${{ vars.FIREBASE_PROJECT_ID }}"
          [ "$CONFIGURED" = "true" ] || mode="DEMO mode (Firebase variables not set)"
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/kalbhairav-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Test APK #${{ github.run_number }}" \
            --notes "चाचणीसाठी APK ($mode). Commit ${{ github.sha }}. Install: download the .apk on the phone and open it (allow 'Install unknown apps')."
          url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          {
            echo "## 📱 APK तयार"
            echo ""
            echo "**Download:** $url"
            echo ""
            echo "Mode: $mode"
            echo ""
            echo "Firebase → Project settings → Android app → *Add fingerprint* (once):"
            echo '```'
            keytool -list -v -keystore android/kjd-debug.keystore -storepass android 2>/dev/null | grep -E "SHA1|SHA256" | sed 's/^[[:space:]]*//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      # In-app update: put the APK at a public link in Firebase Storage and
      # tell installed apps (app_settings/main) that this build is the latest.
      - uses: google-github-actions/auth@v2
        if: vars.FIREBASE_PROJECT_ID != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publish for in-app update
        if: vars.FIREBASE_PROJECT_ID != ''
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          BUILD: ${{ github.run_number }}
          NOTE: ${{ inputs.note }}
          REQUIRED: ${{ inputs.required }}
        run: |
          bucket="${BUCKET:-$PROJECT.firebasestorage.app}"
          apk="$RUNNER_TEMP/kalbhairav-$BUILD.apk"
          for obj in "public/apk/kalbhairav-$BUILD.apk" "public/apk/kalbhairav-latest.apk"; do
            gcloud storage cp "$apk" "gs://$bucket/$obj" \
              --content-type=application/vnd.android.package-archive --cache-control="no-cache"
          done
          link() { echo "https://firebasestorage.googleapis.com/v0/b/$bucket/o/$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1")?alt=media"; }
          url=$(link "public/apk/kalbhairav-$BUILD.apk")
          latest=$(link "public/apk/kalbhairav-latest.apk")
          body=$(python3 - "$BUILD" "$url" "$NOTE" "$REQUIRED" <<'PY'
          import json, sys
          build, url, note, required = sys.argv[1:5]
          fields = {
              "androidBuild": {"integerValue": build},
              "androidApkUrl": {"stringValue": url},
              "androidUpdateNote": {"stringValue": note} if note.strip() else {"nullValue": None},
          }
          if required == "true":
              fields["minAndroidBuild"] = {"integerValue": build}
          print(json.dumps({"fields": fields}))
          PY
          )
          mask="updateMask.fieldPaths=androidBuild&updateMask.fieldPaths=androidApkUrl&updateMask.fieldPaths=androidUpdateNote"
          [ "$REQUIRED" = "true" ] && mask="$mask&updateMask.fieldPaths=minAndroidBuild"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents/app_settings/main?$mask" \
            -d "$body" > /dev/null
          {
            echo "## 🔔 In-app update published"
            echo ""
            echo "Installed apps (build 19 or later) will offer build $BUILD."
            echo ""
            echo "Public download link (share with devotees): $latest"
          } >> "$GITHUB_STEP_SUMMARY"
