# Deploys Firestore/Storage rules, indexes, Cloud Functions and the admin
# panel to Firebase from GitHub's servers – no computer needed.
# Run it from the GitHub mobile site: Actions → "Deploy to Firebase" → Run workflow.
#
# Needs (Settings → Secrets and variables → Actions):
#   Secrets:   FIREBASE_SERVICE_ACCOUNT (JSON key), RAZORPAY_KEY_SECRET,
#              RAZORPAY_WEBHOOK_SECRET
#   Variables: FIREBASE_PROJECT_ID, FIREBASE_API_KEY, FIREBASE_SENDER_ID,
#              FIREBASE_STORAGE_BUCKET, FIREBASE_WEB_APP_ID,
#              RAZORPAY_KEY_ID, BOOTSTRAP_SUPER_ADMIN_EMAILS
# See docs/MOBILE_SETUP.md.
name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options: [all, functions, rules, admin, app]

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_WEB: ${{ vars.FIREBASE_API_KEY != '' && vars.FIREBASE_WEB_APP_ID != '' && vars.FIREBASE_SENDER_ID != '' }}
        run: |
          missing=""
          [ -n "$PROJECT" ] || missing="$missing FIREBASE_PROJECT_ID(variable)"
          [ "$HAS_SA" = "true" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT(secret)"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "admin" ] || [ "$TARGET" = "app" ]; then
            [ "$HAS_WEB" = "true" ] || missing="$missing FIREBASE_API_KEY/FIREBASE_SENDER_ID/FIREBASE_WEB_APP_ID(variables)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing – see docs/MOBILE_SETUP.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: subosito/flutter-action@v2
        if: inputs.target == 'all' || inputs.target == 'admin' || inputs.target == 'app'
        with:
          channel: stable
          cache: true

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Functions config and secrets
        if: inputs.target == 'all' || inputs.target == 'functions'
        env:
          RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
          BOOTSTRAP_SUPER_ADMIN_EMAILS: ${{ vars.BOOTSTRAP_SUPER_ADMIN_EMAILS }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          # Razorpay can be added later: until then payments report
          # "service unavailable" but everything else works.
          if [ -z "$RAZORPAY_KEY_ID" ] || [ -z "$RAZORPAY_KEY_SECRET" ]; then
            echo "::warning::Razorpay keys not set yet – online payments will be unavailable."
            RAZORPAY_KEY_ID="${RAZORPAY_KEY_ID:-rzp_not_configured}"
            RAZORPAY_KEY_SECRET="${RAZORPAY_KEY_SECRET:-not-configured}"
          fi
          RAZORPAY_WEBHOOK_SECRET="${RAZORPAY_WEBHOOK_SECRET:-not-configured}"
          {
            echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID"
            echo "BOOTSTRAP_SUPER_ADMIN_EMAILS=$BOOTSTRAP_SUPER_ADMIN_EMAILS"
          } > "functions/.env.$PROJECT"

          set_secret() {
            current="$(firebase functions:secrets:access "$1" --project "$PROJECT" 2>/dev/null || true)"
            if [ "$current" != "$2" ]; then
              printf '%s' "$2" | firebase functions:secrets:set "$1" --data-file - \
                --project "$PROJECT" --non-interactive --force
            else
              echo "$1 unchanged"
            fi
          }
          set_secret RAZORPAY_KEY_SECRET "$RAZORPAY_KEY_SECRET"
          set_secret RAZORPAY_WEBHOOK_SECRET "$RAZORPAY_WEBHOOK_SECRET"

      - name: Install functions dependencies
        if: inputs.target == 'all' || inputs.target == 'functions'
        working-directory: functions
        run: npm ci

      - name: Build admin panel
        if: inputs.target == 'all' || inputs.target == 'admin'
        working-directory: admin
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_PROJECT_ID="$PROJECT" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ vars.FIREBASE_STORAGE_BUCKET }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --dart-define=FIREBASE_WEB_APP_ID="${{ vars.FIREBASE_WEB_APP_ID }}"

      - name: Build devotee web app
        if: inputs.target == 'all' || inputs.target == 'app'
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_PROJECT_ID="$PROJECT" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ vars.FIREBASE_STORAGE_BUCKET }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --dart-define=FIREBASE_WEB_APP_ID="${{ vars.FIREBASE_WEB_APP_ID }}"

      # Admin panel on the default site (<project>.web.app); the devotee web
      # app on its own site (<project>-app.web.app unless APP_SITE_ID is set).
      - name: Hosting sites
        if: inputs.target == 'all' || inputs.target == 'admin' || inputs.target == 'app'
        env:
          APP_SITE: ${{ vars.APP_SITE_ID }}
        run: |
          APP_SITE="${APP_SITE:-$PROJECT-app}"
          echo "APP_SITE=$APP_SITE" >> "$GITHUB_ENV"
          if [ "$TARGET" != "admin" ]; then
            firebase hosting:sites:get "$APP_SITE" --project "$PROJECT" >/dev/null 2>&1 \
              || firebase hosting:sites:create "$APP_SITE" --project "$PROJECT" --non-interactive
          fi
          firebase target:apply hosting admin "$PROJECT" --project "$PROJECT"
          firebase target:apply hosting app "$APP_SITE" --project "$PROJECT"

      # Lets the web apps load uploaded photos from Cloud Storage.
      - name: Storage CORS
        if: inputs.target == 'all' || inputs.target == 'admin' || inputs.target == 'app'
        env:
          BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        run: |
          gcloud storage buckets update "gs://${BUCKET:-$PROJECT.firebasestorage.app}" --cors-file=storage-cors.json \
            || echo "::warning::Could not set Storage CORS – photos may not show in the web apps."

      - name: Deploy
        run: |
          case "$TARGET" in
            all)       only="firestore:rules,firestore:indexes,storage,functions,hosting" ;;
            functions) only="functions" ;;
            rules)     only="firestore:rules,firestore:indexes,storage" ;;
            admin)     only="hosting:admin" ;;
            app)       only="hosting:app" ;;
          esac
          firebase deploy --only "$only" --project "$PROJECT" --non-interactive --force

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Deployed ($TARGET) to \`$PROJECT\`"
            echo ""
            echo "- Admin panel: https://$PROJECT.web.app"
            if [ -n "$APP_SITE" ]; then echo "- Devotee web app: https://$APP_SITE.web.app"; fi
            echo "- Razorpay webhook URL: \`https://asia-south1-$PROJECT.cloudfunctions.net/razorpayWebhook\`"
          } >> "$GITHUB_STEP_SUMMARY"
