<!DOCTYPE html>
<html lang="mr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="श्री काळभैरव जागृत देवस्थान, रुंधाटी – दर्शन, सेवा बुकिंग, देणगी, उत्सव, सुविचार आणि शुभेच्छा बॅनर.">
  <meta name="theme-color" content="#B71C1C">

  <!-- Install to the home screen (Android Chrome / iPhone Safari). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="काळभैरव">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Link previews (WhatsApp, Facebook). -->
  <meta property="og:title" content="श्री काळभैरव जागृत देवस्थान, रुंधाटी">
  <meta property="og:description" content="दर्शन वेळा, सेवा बुकिंग, देणगी, उत्सव आणि शुभेच्छा बॅनर">
  <meta property="og:image" content="icons/Icon-512.png">

  <title>श्री काळभैरव जागृत देवस्थान, रुंधाटी</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFBF2; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: sans-serif; color: #7F0000; transition: opacity .3s;
    }
    #splash img { width: 160px; height: 160px; object-fit: contain; animation: glow 1.6s ease-in-out infinite; }
    #splash p { margin: 0; font-size: 18px; font-weight: 700; }
    @keyframes glow { 50% { transform: scale(1.05); filter: drop-shadow(0 0 14px #FFC107); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="splash-logo.png" alt="श्री काळभैरव जागृत देवस्थान">
    <p>जय काळभैरव 🙏</p>
  </div>
  <script>
    // Hide the logo screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
