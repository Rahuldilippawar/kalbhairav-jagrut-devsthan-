name: kjd_core
description: Shared models, data layer, theme and business rules for Kalbhairav Jagrut Devsthan apps.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/logo.png
  # Devanagari fonts for the Banner Studio (SIL Open Font License,
  # see assets/fonts/OFL-*.txt). Bundled so banners render identically
  # offline and in exported images.
  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
    - family: YatraOne
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf
    - family: TiroDevanagariMarathi
      fonts:
        - asset: assets/fonts/TiroDevanagariMarathi-Regular.ttf
    - family: PalanquinDark
      fonts:
        - asset: assets/fonts/PalanquinDark-Regular.ttf
        - asset: assets/fonts/PalanquinDark-Bold.ttf
          weight: 700
    - family: Martel
      fonts:
        - asset: assets/fonts/Martel-Regular.ttf
        - asset: assets/fonts/Martel-Bold.ttf
          weight: 700
    - family: Sahitya
      fonts:
        - asset: assets/fonts/Sahitya-Regular.ttf
        - asset: assets/fonts/Sahitya-Bold.ttf
          weight: 700
    - family: Khand
      fonts:
        - asset: assets/fonts/Khand-Regular.ttf
        - asset: assets/fonts/Khand-Bold.ttf
          weight: 700
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: RozhaOne
      fonts:
        - asset: assets/fonts/RozhaOne-Regular.ttf
    - family: Modak
      fonts:
        - asset: assets/fonts/Modak-Regular.ttf
    - family: Laila
      fonts:
        - asset: assets/fonts/Laila-Regular.ttf
        - asset: assets/fonts/Laila-Bold.ttf
          weight: 700
    - family: Amita
      fonts:
        - asset: assets/fonts/Amita-Regular.ttf
        - asset: assets/fonts/Amita-Bold.ttf
          weight: 700
